name: qurmaq

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Java-ni qurun
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter-i qurun
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Platform Yarat
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.fedo.music --project-name fedo_music_pro

    - name: Paketleri Getir
      run: flutter pub get

    - name: APK Yığ
      run: flutter build apk --release --no-tree-shake-icons --build-number=1 --build-name=1.0.0

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
