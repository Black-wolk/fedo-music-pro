name: qurmaq

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Java-nı qurun
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter-i qurun
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Android Platformasını Sıfırdan Sazlayın
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.fedo.music --project-name fedo_music_pro
        
        # app/build.gradle faylına tam uyğun SDK 34 və namespace konfiqurasiyasının enjeksiyası
        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace "com.fedo.music.fedo_music_pro"
            compileSdk 34

            defaultConfig {
                applicationId "com.fedo.music.fedo_music_pro"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        flutter {
            source '../..'
        }
        EOF

    - name: Paketləri Yükləyin
      run: flutter pub get

    - name: Release APK Yığın
      run: flutter build apk --release --no-tree-shake-icons

    - name: Hazır APK-nı Yükləyin
      uses: actions/upload-artifact@v4
      with:
        name: Fedo-Music-Pro-v1.0.0
        path: build/app/outputs/flutter-apk/app-release.apk
